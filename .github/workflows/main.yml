
name: Build Android APK

# Manual only: the "Android APK Build - Worm Temp Copier" workflow publishes the real release
# with a matching versionCode. This one must not produce a second, differently-numbered APK.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Prepare signing keystore (same key every build)
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -n "$APP_KEYSTORE_B64" ]; then
            echo "$APP_KEYSTORE_B64" | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n" \
              "${SUPABASE_URL:-https://nqwmahahhichwmnxccrg.supabase.co}" \
              "${SUPABASE_PUBLISHABLE_KEY:-CONFIGURE_IN_SECRETS}" > .env
          else
            cp .env.example .env
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WormTempCopier-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
