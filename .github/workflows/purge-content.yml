name: Purge content bucket (one-time)

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: "^3"
      - name: Link project
        run: supabase --workdir app link --project-ref nqwmahahhichwmnxccrg
      - name: List bucket before
        run: supabase --workdir app storage ls -r ss:///worm-content-files --linked --experimental || true
      - name: Delete everything in bucket
        run: supabase --workdir app storage rm -r ss:///worm-content-files --linked --experimental --yes || true
      - name: List bucket after
        run: supabase --workdir app storage ls -r ss:///worm-content-files --linked --experimental || true
