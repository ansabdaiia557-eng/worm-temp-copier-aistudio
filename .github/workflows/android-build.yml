name: Android APK Build - Worm Temp Copier

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n" \
              "${SUPABASE_URL:-https://nqwmahahhichwmnxccrg.supabase.co}" \
              "${SUPABASE_PUBLISHABLE_KEY:-CONFIGURE_IN_SECRETS}" > .env
          else
            cp .env.example .env
          fi
      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Worm Temp Copier APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormTempCopier-debug-apk
          path: app/build/outputs/apk/debug/*.apk
