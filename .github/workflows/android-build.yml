name: Android APK Build - Worm Temp Copier

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            printf "SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n" \
              "${SUPABASE_URL:-https://nqwmahahhichwmnxccrg.supabase.co}" \
              "${SUPABASE_PUBLISHABLE_KEY:-CONFIGURE_IN_SECRETS}" > .env
          else
            cp .env.example .env
          fi
      - name: Prepare signing keystore (same key every build)
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
        run: |
          if [ -n "$APP_KEYSTORE_B64" ]; then
            echo "$APP_KEYSTORE_B64" | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Worm Temp Copier APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormTempCopier-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK as the "latest" release (replaces the previous one)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk WormTempCopier.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest WormTempCopier.apk --title "Build ${{ github.run_number }}" --notes "versionCode=${{ github.run_number }}" --latest
