name: Deploy Supabase Backend - ANS SERVER CONTROL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/supabase/**"
      - ".github/workflows/supabase-deploy.yml"

jobs:
  deploy-supabase:
    name: Push Migrations & Deploy 7 Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nqwmahahhichwmnxccrg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required Supabase deployment secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN secret is missing in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "ERROR: SUPABASE_DB_PASSWORD secret is missing in GitHub repository secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase --workdir app link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase --workdir app db push --password "$SUPABASE_DB_PASSWORD"

      - name: Sync Edge Function Secrets (Telegram Bot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            supabase --workdir app secrets set --project-ref "$SUPABASE_PROJECT_REF" TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
          else
            echo "NOTICE: TELEGRAM_BOT_TOKEN GitHub Secret is not set; skipping secret sync."
          fi
          if [ -n "$TELEGRAM_CHANNEL_ID" ]; then
            supabase --workdir app secrets set --project-ref "$SUPABASE_PROJECT_REF" TELEGRAM_CHANNEL_ID="$TELEGRAM_CHANNEL_ID"
          fi

      - name: Deploy all 7 Edge Functions
        run: |
          for fn in \
            server-gate-status \
            redeem-activation-code \
            app-update-check \
            record-operation-audit \
            get-download-url \
            verify-telegram-membership \
            admin-control; do
            echo "Deploying Edge Function: $fn"
            supabase --workdir app functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
